# The MC5S3DP-XHAT machine on the gcode driver, talking to the built-in grblHAL simulator instead of the board.
# Same G-code as the real machine; no hardware. For trying the gcode driver, UI work and tests.
# Run: tinkerpnp --config config/examples/simulated-grblhal.yaml

format: tinkerpnp-machine/1
name: MC5S3DP-XHAT (grblHAL simulator)

machine:
  on_enable: [home]
  on_before_home: [safe_z]         # nozzles up before $H (it homes X and Y before Z), if the position is known
  on_home: [park]
  park:
    head: H1
    location: {x: 1, y: 1}
  macros:                          # buttons on the Machine page; run with machine.run_macro
    N1 to bottom camera:
      - move_to: {object: nozzle/N1, location: {x: 189.9, y: 49.5, z: 38.0}}
    N2 to bottom camera:
      - move_to: {object: nozzle/N2, location: {x: 189.9, y: 49.5, z: 38.0}}
    Valves off:
      - actuate: {valve1: off, valve2: off}
    Pick test N1:                  # vacuum on, down, wait, up
      - actuate: {pump: on, valve1: on}
      - dwell: 300
      - move_to: {object: nozzle/N1, location: {z: 30}}
      - dwell: 200
      - safe_z
    Status report:
      - gcode: "?"

drivers:
  grbl:
    type: gcode
    name: grblHAL simulator
    port: sim://grblhal?time_scale=1&home_time=2   # real-time moves, homing takes 2 s
    profile: grblhal                                # $I, Ctrl-X, $SLP, $H, G1 ... F, G4 P0, ? (see docs/drivers.md)

axes:
  x: {type: controller, driver: grbl, letter: X, soft_limits: [0, 500], feed: 8000 mm/min, acceleration: 200}
  y: {type: controller, driver: grbl, letter: Y, soft_limits: [0, 345], feed: 6000 mm/min, acceleration: 100}
  z:
    type: controller
    driver: grbl
    letter: Z
    home: 0                        # $H (home all axes) puts Z at 0; on_home: [park] lifts both nozzles to 57
    soft_limits: [0, 116]
    safe_zone: [57, 57]
    feed: 3000 mm/min
  a: {type: controller, driver: grbl, letter: A, kind: rotation, limit_rotation: [-180, 180], feed: 3000 deg/min}
  b: {type: controller, driver: grbl, letter: B, kind: rotation, limit_rotation: [-180, 180], feed: 3000 deg/min}
  z_n2: {type: mapped, input: z, map: [[0, 114], [114, 0]]}
  z_top_camera: {type: virtual}
  rot_top_camera: {type: virtual, kind: rotation}

heads:
  H1:
    name: Main head
    axes: {x: x, y: y}
    pump: pump
    nozzles:
      N1: {name: Nozzle 1, axes: {z: z, rotation: a}, offset: {x: 0, y: 0}, vacuum: valve1, tip: NT1, compatible_tips: [NT1]}
      N2: {name: Nozzle 2, axes: {z: z_n2, rotation: b}, offset: {x: 33.2, y: 0}, vacuum: valve2, tip: NT2, compatible_tips: [NT2]}
    cameras:
      top:
        type: simulated
        name: Top (down-looking)
        looking: down
        axes: {z: z_top_camera, rotation: rot_top_camera}
        offset: {x: 21.9, y: 20.0}
        units_per_pixel: {x: 0.04, y: 0.04}
        # the demo board's fiducials as if the board lay at 150.6 / 120.4, turned 0.3 degrees (job: 150 / 120)
        sim_fiducials:
          - {x: 152.59, y: 122.41, diameter: 1.0}
          - {x: 195.468, y: 145.635, diameter: 1.0}
    actuators: [pump, valve1, valve2]

nozzle_tips:
  NT1: {name: Nozzle tip 1, max_part_diameter: 20, max_part_height: 5}
  NT2: {name: Nozzle tip 2, max_part_diameter: 20, max_part_height: 5}

actuators:
  pump: {type: gcode, driver: grbl, name: Vacuum pump, on: M3 S1000, off: M5, on_enable: off, on_disable: off}
  valve1: {type: gcode, driver: grbl, name: Valve 1 (N1 vacuum), on: M64 P0, off: M65 P0, on_enable: off, on_disable: off}
  valve2: {type: gcode, driver: grbl, name: Valve 2 (N2 vacuum), on: M64 P1, off: M65 P1, on_enable: off, on_disable: off}

cameras:
  bottom:
    type: simulated
    name: Bottom (up-looking)
    looking: up
    location: {x: 189.9, y: 49.5, z: 38.0}
    units_per_pixel: {x: 0.02, y: 0.02}

feeders:
  F1:
    type: static
    name: Loose part on the bed
    part: R0805-1K
    pick_location: {x: 237.9, y: 119.5, z: 6.0, rotation: 0}
  # strips and a tray holding the parts of docs/examples/demo.pos (KiCad import, board "demo")
  S1:
    type: strip
    name: 100n 0603 tape
    part: C_0603_1608Metric-100n
    first: {x: 60, y: 300, z: 6, rotation: 90}
    last: {x: 160, y: 300}
    pitch: 4
  S2:
    type: strip
    name: 10k 0805 tape
    part: R_0805_2012Metric-10k
    first: {x: 60, y: 315, z: 6, rotation: 90}
    last: {x: 160, y: 315}
    pitch: 4
  T1:
    type: tray
    name: STM32 tray
    part: LQFP-64_10x10mm_P0.5mm-STM32F411
    first: {x: 400, y: 250, z: 5}
    columns: 3
    rows: 2
    column_step: {x: 15, y: 0}
    row_step: {x: 0, y: 15}
